name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Build-time env is not required for a successful compile; the app
          # degrades gracefully when these are absent. Provided empty so the
          # build step never depends on real secrets in CI.
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
          GEMINI_API_KEY: ""
